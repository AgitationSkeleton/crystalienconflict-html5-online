# The offline client (client/): built for Windows, macOS and Linux and published as a GitHub
# release, which is where the app looks for updates; and the Android app (mobile/), its .apk in
# the same release.  The apps carry their own copy of the game, so they are built again whenever
# the game changes -- every push to main that touches the game or an app, as version
# 1.1.<this workflow's run number> -- and on a version tag (v1.2.3), as that version.  An
# installed desktop app finds the new one and installs it on quitting; the Android app says so.
name: App
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['index.html', 'src/**', 'data/**', 'assets/**', 'client/**', 'mobile/**', '.github/workflows/app.yml']
permissions:
  contents: write
# (one release at a time, in order)
concurrency:
  group: app-release
  cancel-in-progress: false
jobs:
  draft:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: The version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v="1.1.${GITHUB_RUN_NUMBER}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: A draft release for the builds to go in
        run: |
          gh release create "v${{ steps.version.outputs.version }}" --target "$GITHUB_SHA" --draft --title "CrystAlien Conflict Online v${{ steps.version.outputs.version }}" --notes "The game as an app, for Windows, macOS, Linux and Android, the same as the website (caconline.viosarcade.xyz) at this version, playing online with it. Download the one for your device below. The computer apps keep themselves up to date; the Android app (the .apk: open it on the phone to install it, letting your browser install apps if asked) says when a new one is out, to download over it. (Windows may warn that it doesn't know the publisher: More info, Run anyway. macOS wants a right-click and Open the first time.) On an iPhone or iPad, install the website from Safari: Share, Add to Home Screen." || true
        env:
          GH_TOKEN: ${{ github.token }}
  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: client
      - run: npm version "${{ needs.draft.outputs.version }}" --no-git-tag-version --allow-same-version
        working-directory: client
      - run: npx electron-builder --publish always
        working-directory: client
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
  # The Android app: signed with the release key (the CAC_KEYSTORE_* secrets; mobile/README.md),
  # its version the release's and its version code this run's number.
  android:
    needs: draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        working-directory: mobile
      - run: npm run sync
        working-directory: mobile
      - name: The release key
        run: echo "$CAC_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
        env:
          CAC_KEYSTORE_BASE64: ${{ secrets.CAC_KEYSTORE_BASE64 }}
      - name: The APK
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleRelease "-PversionCode=${{ github.run_number }}" "-PversionName=${{ needs.draft.outputs.version }}" --no-daemon
        env:
          CAC_KEYSTORE: ${{ runner.temp }}/release.jks
          CAC_KEYSTORE_PASSWORD: ${{ secrets.CAC_KEYSTORE_PASSWORD }}
          CAC_KEY_ALIAS: ${{ secrets.CAC_KEY_ALIAS }}
          CAC_KEY_PASSWORD: ${{ secrets.CAC_KEY_PASSWORD }}
      - name: Into the release
        run: |
          f="CrystAlien-Conflict-Online-${{ needs.draft.outputs.version }}-android.apk"
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "$f"
          gh release upload "v${{ needs.draft.outputs.version }}" "$f" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
  publish:
    needs: [draft, build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gh release edit "v${{ needs.draft.outputs.version }}" --draft=false --latest
        env:
          GH_TOKEN: ${{ github.token }}
